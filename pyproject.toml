[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispenser-sim"
version = "0.1.0"
description = "Offline simulation of the smart medical dispenser's dispensing mechanism"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dispenser-sim = "dispenser_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dispenser_sim.viz3d" = ["concept_geometry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
