; PlatformIO project for the scheduling system (serial test rig). Build with: pio run   Upload with: pio run -t upload
; It uses the rotation mechanism next door as a library. ASSUMED / NOT_VALIDATED, not built in this repository's tests:
; the portable core is tested on the host (see test/).
[platformio]
src_dir = firmware

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../rotation-mechanism
